[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "avoar-turi"
version = "0.1.0"
description = "Geração dos dumps, assets e índices do Avoar"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "adbc-driver-manager==1.11.0",
    "adbc-driver-postgresql==1.11.0",
    "aiofiles>=25.1.0",
    "aiohttp>=3.14.5",
    "apscheduler==3.11.2",
    "avoar-core",
    "ckanapi==4.11",
    "curl-cffi==0.16.2",
    "datafusion>=55.0.0",
    "geopandas>=1.2.0",
    "httpx==0.28.1",
    "msgspec==0.21.1",
    "nltk==3.9.3",
    "numpy==2.4.2",
    "pandas==3.0.1",
    "playwright==1.62.0",
    "polars==1.38.1",
    "polars-runtime-32==1.38.1",
    "psutil==7.2.2",
    "pyarrow==25.0.1",
    "pydantic==2.12.5",
    "python-dateutil==2.9.0.post0",
    "python-dotenv==1.2.2",
    "pyyaml>=6.0.3",
    "requests==2.34.2",
    "shapely>=2.2.0",
    "snowflake-id==1.0.2",
    "tantivy==0.26.0",
    "unidecode==1.4.0",
    "xmltodict>=1.0.4",
    "zstandard==0.25.0",
]

[project.scripts]
turi = "apps.turi.src.cli:dumps"
turi-download = "apps.turi.src.cli:downloads"
turi-schedule = "apps.turi.src.cli:schedule"
turi-index = "apps.turi.src.cli:indexes"

[tool.setuptools.packages.find]
include = ["apps*", "avoar*"]
namespaces = true
exclude = [
    "assets*",
    "downloads*",
    "parquet_dumps*",
    "venato_data*",
    "docs*",
    "tests*",
    "apps.turi.tests*",
    "*.scripts.__metadata__*",
]

[tool.setuptools.package-data]
"avoar.infra.venato" = ["indexes/*.yaml"]
"apps.turi.src.downloaders._sds" = ["datasets/*/*.json", "datasets/*/*.txt", "LICENSE"]

[tool.uv.sources]
avoar-core = { git = "https://github.com/avoarpj/core.git", rev = "56339faa0e7341f1abc927d0b330e66615edaa3c" }
